services:
  postgres:
    image: postgres:17
    container_name: gtms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gtms
      POSTGRES_PASSWORD: gtms_dev_password
      POSTGRES_DB: gtms_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
